<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configura 2FA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .setup-card {
      width: 380px;
      padding: 2rem;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .logo {
      display: block;
      margin: 0 auto 1rem auto;
      max-width: 120px;
    }
    .secret-box {
      font-family: monospace;
      font-size: 0.85rem;
      background: #f0f0f0;
      padding: 0.5rem;
      border-radius: 6px;
      word-break: break-all;
      text-align: center;
      user-select: all;
    }
    #qr-canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="setup-card">
    <img src="/static/img/logoLight.png" alt="Logo" class="logo">

    <h5 class="text-center mb-3">Configura autenticazione 2FA</h5>

    <p class="text-muted small text-center">
      Scansiona il QR code con la tua app di autenticazione
      (Google Authenticator, Authy, ecc.)
    </p>

    <!-- QR Code generato client-side -->
    <canvas id="qr-canvas" class="mb-3"></canvas>

    <p class="text-muted small text-center mb-1">Oppure inserisci manualmente il codice:</p>
    <div class="secret-box mb-3">{{ totp_secret }}</div>

    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label small">Inserisci il codice a 6 cifre per verificare:</label>
        <input name="code" type="text" class="form-control text-center"
               inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
               autocomplete="one-time-code" placeholder="000000" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Verifica e attiva</button>
    </form>
  </div>

  <!-- QR code library (lightweight, no dependencies) -->
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <script>
    new QRious({
      element: document.getElementById('qr-canvas'),
      value: {{ totp_uri | tojson }},
      size: 200,
      level: 'M'
    });
  </script>
</body>
</html>
