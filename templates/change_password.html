<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambio Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      width: 380px;
      padding: 2rem;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .logo {
      display: block;
      margin: 0 auto 1rem auto;
      max-width: 120px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/static/img/logoLight.png" alt="Logo" class="logo">
    <h5 class="text-center mb-3">Cambio password obbligatorio</h5>
    <p class="text-muted small text-center">Per motivi di sicurezza, devi impostare una nuova password.</p>
    <p class="text-muted small">Requisiti: almeno 8 caratteri, una maiuscola, una minuscola, un numero e un carattere speciale.</p>

    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label small">Nuova password</label>
        <input name="new_password" type="password" class="form-control"
               minlength="8" autocomplete="new-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Conferma password</label>
        <input name="confirm_password" type="password" class="form-control"
               minlength="8" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Cambia password</button>
    </form>
  </div>
</body>
</html>
